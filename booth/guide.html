</style><body><div class="brand"><img src="../app/assets/icon.png">PostClip</div><div class="eyebrow">HOW TO USE</div><h1>貼って、選んで、保存。</h1><p class="lead">切り抜きの手間を、3ステップに。</p><div class="steps"><div class="step"><span class="num">01</span><div><h2>投稿のURLを貼る</h2><p>x.com / twitter.com のリンクに対応。</p></div></div><div class="step"><span class="num">02</span><div><h2>幅と画質を選ぶ</h2><p>標準は400px幅・3倍解像度。返信先の有無も選べます。</p></div></div><div class="step"><span class="num">03</span><div><h2>プレビューを確認してPNG保存</h2><p>画像コピーや実寸表示も使えます。</p></div></div></div><div class="result"><img src="sample-post.png"></div><div class="label">横1,200pxのPNG<br>文字から高解像度で描画</div><div class="notes">公開投稿は公式埋め込みで撮影。<br>X側の省略・閲覧制限により、表示や取得の範囲は異なります。</div><div class="tag">架空サンプル / 高さは投稿によって変わります</div></body></html>
